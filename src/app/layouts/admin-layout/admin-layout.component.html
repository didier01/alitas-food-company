<!-- Añadimos dinámicamente el class theme-dark o theme-light al contenedor global -->
<nz-layout class="admin-layout" [ngClass]="'theme-' + themeService.temaAdmin()">
  <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed" nzBreakpoint="md" [nzTheme]="themeService.temaAdmin()"
    [ngClass]="'theme-' + themeService.temaAdmin()">
    <div class="logo-admin">
      <h2 nz-tooltip nzTooltipTitle="Alitas Food Company" nzPlacement="right">{{ isCollapsed ? '🔥' : '🔥 Alitas Food
        C...'
        }}</h2>
    </div>
    <ul nz-menu [nzTheme]="themeService.temaAdmin()" nzMode="inline" class="menu-sider">

      <!-- Grupo: Ventas (Solo Dashboard en MVP) -->
      <li nz-submenu nz-tooltip nzTooltipTitle="General" nzTitle="General" nzIcon="line-chart" [nzOpen]="true">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/dashboard">
              <span nz-icon nzType="dashboard"></span>
              <span>Dashboard</span>
            </a>
          </li>
          <!-- <li nz-menu-item nzMatchRouter *ngIf="canAccessPOS()">
            <a routerLink="/admin/pos">
              <span nz-icon nzType="wallet"></span>
              <span style="color: var(--california-500); font-weight: bold;">Punto de Venta (POS)</span>
            </a>
          </li> -->
          <!-- <li nz-menu-item nzMatchRouter *ngIf="canManageOrders()">
            <a routerLink="/admin/orders">
              <span nz-icon nzType="shopping-cart"></span>
              <span>Pedidos</span>
            </a>
          </li> -->
        </ul>
      </li>

      <!-- Grupo: Carta Digital -->
      <li nz-submenu nz-tooltip nzTooltipTitle="Gestión de la Carta" nzTitle="Gestión de la Carta" nzIcon="appstore"
        [nzOpen]="true">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/categories">
              <span nz-icon nzType="unordered-list"></span>
              <span>Categorías</span>
            </a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/products">
              <span nz-icon nzType="shopping"></span>
              <span>Productos</span>
            </a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/combos">
              <span nz-icon nzType="gift"></span>
              <span>Combos</span>
            </a>
          </li>
          <!-- <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/promotions">
              <span nz-icon nzType="tag"></span>
              <span>Promociones</span>
            </a>
          </li> -->
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/menus">
              <span nz-icon nzType="appstore"></span>
              <span>Menús</span>
            </a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/complements/allergens">
              <span nz-icon nzType="medicine-box"></span>
              <span>Alérgenos</span>
            </a>
          </li>
          <!-- <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/complements/modifiers">
              <span nz-icon nzType="plus-square"></span>
              <span>Modificadores</span>
            </a>
          </li> -->
        </ul>
      </li>

      <!-- Grupo: Logística -->
      <li nz-submenu nz-tooltip nzTooltipTitle="Gestión de Local" nzTitle="Gestión de Local" nzIcon="shop">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/venues">
              <span nz-icon nzType="shop"></span>
              <span>Sedes</span>
            </a>
          </li>
        </ul>
      </li>

      <!-- Grupo: Sistema (Deshabilitado en MVP) -->
      <!-- <li nz-submenu nzTitle="Sistema" nzIcon="setting" *ngIf="isSuperAdmin()">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/admin/users">
              <span nz-icon nzType="team"></span>
              <span>Usuarios</span>
            </a>
          </li>
        </ul>
      </li> -->
    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header class="admin-header">
      <div class="header-content">
        <span class="trigger" nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"
          (click)="isCollapsed = !isCollapsed"></span>
        <div class="header-actions">
          <span class="user-greeting">Hola, {{ authService.currentUser()?.name }}!</span>
          <!-- <app-theme-toggle></app-theme-toggle> -->
          <button class="logout-btn" (click)="logout()">
            <span nz-icon nzType="logout"></span>
          </button>
        </div>
      </div>
    </nz-header>
    <nz-content class="admin-content-wrapper">
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
